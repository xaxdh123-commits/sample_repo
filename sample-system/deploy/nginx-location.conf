# Add this location to the existing HTTPS server for private.qiyinbz.com:41287.
location /samples/ {
    # Internal test backend; replace this address when promoting to production.
    proxy_pass http://192.168.22.191:8081/samples/;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 30m;
}
