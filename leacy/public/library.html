<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>样品库查询</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>样品库查询</h1>
        <p>按样品编号、版号、客户名、店铺、店铺负责人或号码检索，只能查看。</p>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="searchbar">
          <input id="searchInput" placeholder="输入版号、客户名、店铺、样品编号..." autofocus />
          <button id="searchButton" type="button">检索</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>样品编号</th>
                <th>图片</th>
                <th>版号</th>
                <th>客户名</th>
                <th>店铺</th>
                <th>店铺负责人</th>
                <th>号码</th>
                <th>日期</th>
                <th>备注</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="sampleRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="imageModal" class="modal-backdrop" hidden>
      <div class="modal image-modal" role="dialog" aria-modal="true" aria-labelledby="imageTitle">
        <div class="modal-head">
          <h2 id="imageTitle">样品图片</h2>
          <button type="button" id="closeImageModal" class="secondary">关闭</button>
        </div>
        <img id="largeImage" alt="样品图片" />
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="/library.js"></script>
  </body>
</html>
